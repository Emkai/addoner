name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    # Arch, so the binary matches the Qt that Omarchy ships.
    container: archlinux:latest
    steps:
      - name: Install toolchain and Qt
        run: pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative qt6-wayland libarchive

      - uses: actions/checkout@v4

      - name: Build
        run: bin/build

      - name: Test
        run: bin/test

      - name: Package
        run: |
          mkdir -p dist/addoner
          cp build/addoner README.md LICENSE dist/addoner/
          cp pkgbuild/addoner.desktop pkgbuild/addoner.svg dist/addoner/
          tar -czf addoner-linux-x86_64.tar.gz -C dist addoner

      - uses: actions/upload-artifact@v4
        with:
          name: addoner-linux-x86_64
          path: addoner-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\addoner.pro
          nmake

      - name: Test
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build\tests
          cd build\tests
          qmake ..\..\tests\addoner_tests.pro
          nmake
          for /r %%f in (addoner_tests.exe) do if exist "%%f" "%%f" || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter addoner.exe | Select-Object -First 1
          New-Item -ItemType Directory dist/addoner | Out-Null
          Copy-Item $exe.FullName dist/addoner/
          windeployqt --release --qmldir src --no-translations dist/addoner/addoner.exe
          Copy-Item README.md, LICENSE dist/addoner/
          Compress-Archive dist/addoner addoner-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: addoner-windows-x86_64
          path: addoner-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
